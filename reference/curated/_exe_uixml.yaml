# Element aliases and notes for the ForgeUI XML vocabulary (inferred). elements: control type (C++ class) -> element name used in UI XML files.
elements:
  TextControl: Label
  ImageControl: Image
  ButtonControl: Button
  TextButtonControl: TextButton
  GridButtonControl: GridButton
  GridControl: Grid
  StackControl: Stack
  ScrollPanelControl: ScrollPanel
  PullDownControl: PullDown
  CheckBoxControl: CheckBox
  RadioButtonControl: RadioButton
  EditBoxControl: EditBox
  SliderControl: Slider
  MeterControl: Meter
  MovieControl: Movie
  LineControl: Line
  GraphControl: Graph
  DragControl: Drag
  TabControl: Tab
  AnimControl: SlideAnim
  AlphaAnim: AlphaAnim
  FlipAnim: FlipAnim
  TweenControl: null
  ColorBoxButtonControl: ColorBox
  ScrollTextControl: ScrollTextField
  TutorialControl: Tutorial
  WorldAnchorControl: WorldAnchor
  ContextBase: Context
  ListBoxControlBase: ListBox
  ButtonControlBase: null
  ControlBase: Container
notes:
  ID: "Name by which scripts reach the control (`Controls.<ID>`)."
  Anchor: "Where the control sits in its parent, as `horizontal,vertical` (for example `C,C` or `L,T`)."
  Size: "Width and height in pixels, as `w,h`."
  Offset: "Position offset from the anchor, as `x,y`."
  Hidden: "Starts hidden."
  Texture: "Image file for the control."
  ConsumeMouse: "Stops mouse events from reaching controls underneath."
  AutoSize: "Size the control to its content."
  Color: "Tint colour, as `r,g,b,a` or a style colour name."
  String: "Text or text key to show."
  FontStyle: "A named style from the style sheets."
  ToolTip: "Tooltip text key."

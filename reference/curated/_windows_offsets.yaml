# Windows offsets that were checked against Windows code (decompilation, disassembly, runtime or the CE wiki).
# Everything else in a layout page is the Linux offset. relation: same = identical on both platforms, minus8 = Linux offset minus 8, differs = other.
windows_offsets:
  - {layout: "Player::Instance", member: m_pkCities, windows_offset: "0x6d0", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "city lookup reads [player+0x6d0]"}]}
  - {layout: "Player::Instance", member: m_pkDiplomacy, windows_offset: "0x6e0", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "SetHasOpenBordersFrom callers read [player+0x6e0]"}]}
  - {layout: "Player::Instance", member: m_pkCulture, windows_offset: "0x6f0", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "ReceiveGreatWork callers use player+0x6f0"}]}
  - {layout: "City::Instance", member: m_kBuildings, windows_offset: "0xca0", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "tracked-variable wrapper; Buildings object at +0xcb0 after edit()"}]}
  - {layout: "City::IInstance", member: m_eOwner, windows_offset: "0xc8", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "owner value read at city+0xd8"}]}
  - {layout: "Game::Culture", member: m_kGreatWorks, windows_offset: "0x108", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "record list begin/end at +0x118/+0x120 in FindOrAddGreatWork"}]}
  - {layout: "Unit::Instance", member: m_iBuildCharges, windows_offset: "0x528", relation: minus8, status: verified, evidence: [{kind: runtime, note: "value at unit+0x538 changed 3 to 2 when a builder built an improvement"}]}
  - {layout: "Unit::Instance", member: m_kCombatModifers, windows_offset: "0x790", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "combat modifier effects take lea rcx,[unit+0x790]"}]}
  - {layout: "Unit::IInstance", member: m_eOwner, windows_offset: "0x120", relation: minus8, status: verified, evidence: [{kind: community-reference, note: "CE wiki lists the owner value at 0x128 (wrapper +0x10)"}]}
  - {layout: "Player::Diplomacy", member: m_iOpenBordersFromCount, windows_offset: "0x480", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "counters read at +0x490 + player*4"}]}
  - {layout: "Player::Diplomacy", member: m_iOpenBordersEndedTurn, windows_offset: "0x590", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "edit() called on this+0x590 in SetHasOpenBordersFrom"}]}
  - {layout: "Map::Feature::Manager", member: m_aVolcanoes, windows_offset: "0x110", relation: minus8, status: verified, evidence: [{kind: static-analysis, note: "SetVolcanoActive scans the list at this+0x110"}]}
  - {layout: "Player::Influence", member: m_xPointsEarned, windows_offset: "0xa8", relation: minus8, status: verified, evidence: [{kind: community-reference, note: "CE wiki lists influence points x256 at 0xb8 (wrapper +0x10)"}]}
  - {layout: "Map::Plot::Reflection::Variants1", member: m_iPlotAppeal, windows_offset: "0xe", relation: same, status: verified, evidence: [{kind: community-reference, note: "CE wiki lists appeal at plot+0x4a; Plot::Instance.m_kVariants is at 0x3c"}]}
  - {layout: "Unit::Experience", member: m_iExperience, windows_offset: "0xc", relation: same, status: verified, evidence: [{kind: community-reference, note: "CE wiki lists experience at 0xc"}]}
  - {layout: "Unit::Experience", member: m_iLevel, windows_offset: "0x10", relation: same, status: verified, evidence: [{kind: community-reference, note: "CE wiki lists level at 0x10"}]}
  - {layout: "City::Buildings", member: m_aGreatWorkBuildings, windows_offset: "0xc8", relation: same, status: verified, evidence: [{kind: static-analysis, note: "RemoveGreatWork walks the array at this+0xc8"}]}
  - {layout: "Game::GreatWork", member: m_eType, windows_offset: "0x0", relation: same, status: verified, evidence: [{kind: static-analysis, note: "FindOrAddGreatWork record layout"}]}
  - {layout: "Game::GreatWork", member: m_ePlayer, windows_offset: "0x4", relation: same, status: verified, evidence: [{kind: static-analysis, note: "SetGreatWorkPlayer writes record+4"}]}
  - {layout: "Game::GreatWork", member: m_iTurnCreated, windows_offset: "0x8", relation: same, status: verified, evidence: [{kind: static-analysis, note: "FindOrAddGreatWork stores the current turn at +8"}]}
  - {layout: "Diplomacy::Deal::Item::Instance", member: m_eFromPlayer, windows_offset: "0x28", relation: same, status: verified, evidence: [{kind: static-analysis, note: "GreatWork Enact reads the giver at item+0x28"}]}
  - {layout: "Diplomacy::Deal::Item::Instance", member: m_eToPlayer, windows_offset: "0x2c", relation: same, status: verified, evidence: [{kind: static-analysis, note: "GreatWork Enact reads the receiver at item+0x2c"}]}
  - {layout: "Diplomacy::Deal::Item::GreatWork", member: m_iHeldGreatWork, windows_offset: "0x90", relation: differs, status: verified, evidence: [{kind: static-analysis, note: "Enact stores the stranded index at this+0x90; the Linux object is 4 bytes smaller"}]}
  - {layout: "Game::GlobalParameters", member: m_EXPERIENCE_BARB_SOFT_CAP, windows_offset: "0x2fc", relation: same, status: verified, evidence: [{kind: static-analysis, note: "CalculateExperienceEarned reads [params+0x2fc]"}]}
  - {layout: "Game::GlobalParameters", member: m_EXPERIENCE_MAX_BARB_LEVEL, windows_offset: "0x314", relation: same, status: verified, evidence: [{kind: static-analysis, note: "CalculateExperienceEarned reads [params+0x314]"}]}

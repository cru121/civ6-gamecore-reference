note: Keys, files and comment lines of the option files the game writes (snapshot
  2026-10-19, read from the local install). Used for the file column and for descriptions
  the exe scan could not read.
file_versions:
  AppOptions.txt: 15
  UserOptions.txt: 1
  GraphicsOptions.txt: 10
  EOSOptions.txt: 1

id: lua:Game.GetGreatWorkDataFromIndex
summary: "Returns the data record for a great work list index."
notes:
  - text: "Not bounds-checked. Calling it with an index past the end of the great work list reads beyond the list and crashed the game."
    status: verified
    evidence: [{kind: runtime, note: crash reproduced while opening a screen that scanned past the list end}]
related: [lua:Game.GetGreatWorkPlayer]

id: lua:Calendar.GetTurnYearForGame
summary: "Returns the calendar year for a game turn."
notes:
  - text: "The Calendar object (4 methods) is registered on the UI cache state only, so gameplay scripts cannot call it directly. Civ6-GCO wraps it in a UI-context function and reaches it through ExposedMembers."
    status: verified
    evidence: [{kind: dll-registration, note: "Calendar has 4 methods, all ui-cache"}, {kind: community-reference, note: "Civ6-GCO InGame/GCO_ContextFunctions.lua:93; third-party mod Civ6-GCO (Gedemon, 2021), not a Firaxis script"}]

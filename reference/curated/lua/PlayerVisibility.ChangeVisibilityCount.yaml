id: lua:PlayerVisibility.ChangeVisibilityCount
summary: "Raises or lowers the visibility count of a plot for a player, which reveals or hides it."
notes:
  - text: "Civ6-GCO calls it as ChangeVisibilityCount(plotIndex, 1) to force-reveal a plot, because the AI only starts a scripted operation when the rally and target plots are visible. It also applies it to every plot along a path. The arguments are a single plot index and a signed delta, which is the single-plot-index form of the recovered signature. No hide-again call was seen."
    status: inferred
    evidence: [{kind: community-reference, note: "Civ6-GCO Scripts/GCO_AIUnitScript.lua:383-411, 702; third-party mod Civ6-GCO (Gedemon, 2021), not a Firaxis script"}]
related: [lua:PlayerVisibility.IsRevealed, lua:AiMilitary.StartScriptedOperationWithTargetAndRally]

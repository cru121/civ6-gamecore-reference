id: lua:HallofFame.GetRulesetTypes
summary: "Returns the list of rulesets known to the game summary data; the wrapper itself reads no argument."
notes:
  - text: "The wrapper code reads nothing from the Lua stack: it takes the ruleset list from the current game's summary repository and builds a table of rows with the fields Type, Kind, Name and Icon. An argument passed from Lua (two of the game's own UI scripts pass a ruleset value) is therefore ignored by this function as far as the code shows. A tester suggested a one-argument form; that was not confirmed, and the listed no-parameter signature stands."
    status: inferred
    evidence: [{kind: static-analysis, note: "decompiled wrapper (lGetRulesetTypes) has no stack argument reads; the tester's 1-arg question is untested"}]

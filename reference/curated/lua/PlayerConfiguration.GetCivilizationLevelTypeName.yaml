id: lua:PlayerConfiguration.GetCivilizationLevelTypeName
summary: "Returns the civilization level type name of a player slot, or nil."
notes:
  - text: "Civ6-GCO compares the result with \"CIVILIZATION_LEVEL_TRIBE\" to tell tribe slots from major civilizations, so the string is a CivilizationLevels type name."
    status: inferred
    evidence: [{kind: community-reference, note: "Civ6-GCO Scripts/GCO_DiplomacyScript.lua ~977; third-party mod Civ6-GCO (Gedemon, 2021), not a Firaxis script"}]

id: lua:MapResourceBuilder.SetResourceType
summary: "Places a resource of a given type on a plot, with an amount."
notes:
  - text: "Civ6-GCO calls it as ResourceBuilder.SetResourceType(plot, resourceID, count) with a randomised count on turn one. That matches the recovered iAmount parameter: the last argument is the number of resource units on the plot, not a flag."
    status: inferred
    evidence: [{kind: community-reference, note: "Civ6-GCO Scripts/GCO_GameScript.lua:130; third-party mod Civ6-GCO (Gedemon, 2021), not a Firaxis script"}]

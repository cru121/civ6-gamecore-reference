id: lua:PlayerTechs.SetResearchProgress
summary: "Sets the research progress of a technology; returns whether it was applied."
notes:
  - text: "Civ6-GCO unlocks a hidden gate technology by setting its progress to its full cost, SetResearchProgress(techID, GetResearchCost(techID)), and re-applies the current research progress afterwards. It reports that its ResearchChanged guard did not reliably stop the AI from re-picking locked technologies in the same turn (tested January 2021)."
    status: inferred
    evidence: [{kind: community-reference, note: "Civ6-GCO Scripts/GCO_ResearchScript.lua:832-880, 1709; third-party mod Civ6-GCO (Gedemon, 2021), not a Firaxis script"}]
